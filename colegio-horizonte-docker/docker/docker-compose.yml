# Colégio Horizonte - CP3
# Serviços hospedados no SRV-01 (10.10.1.226, VLAN 40 - Servidores)
# Subir:  docker compose up -d

services:
  mysql:
    image: mysql:8.0
    container_name: horizonte-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Root@Horizonte2026
      MYSQL_DATABASE: colegio_horizonte
      MYSQL_USER: horizonte
      MYSQL_PASSWORD: Horizonte@2026
    ports:
      - "3307:3306"          # porta do host 3307 -> porta 3306 do container
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      horizonte-net:
        ipv4_address: 172.20.0.20

  nginx:
    image: nginx:alpine
    container_name: horizonte-nginx
    restart: unless-stopped
    ports:
      - "8080:80"            # porta do host 8080 -> porta 80 do container
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      horizonte-net:
        ipv4_address: 172.20.0.10

networks:
  horizonte-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

volumes:
  mysql_data:
